<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Blueprint Platform hosts polished self-contained business blueprints for practical AI-enabled operations tools."
    />
    <title>Blueprint Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const isGitHubPages = window.location.hostname.endsWith("github.io");
      const useStaticBuild = isGitHubPages || window.location.search.includes("static-build");

      if (useStaticBuild) {
        const stylesheet = document.createElement("link");
        stylesheet.rel = "stylesheet";
        stylesheet.href = "./assets/index.css";
        document.head.appendChild(stylesheet);

        const appScript = document.createElement("script");
        appScript.type = "module";
        appScript.src = "./assets/app.js";
        document.body.appendChild(appScript);
      } else {
        const devScript = document.createElement("script");
        devScript.type = "module";
        devScript.src = "/src/main.jsx";
        document.body.appendChild(devScript);
      }
    </script>
  </body>
</html>
